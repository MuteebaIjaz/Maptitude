
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Maptitude</title>
    <link rel="stylesheet" href="maptitude.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Maptitude</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>

        <div class="search-container">
            <input type="text" id="searchInput"
                placeholder="Search destinations...">
            <button id="searchBtn">Search</button>
            <button id="clearBtn">Clear</button>
        </div>
    </nav>

    <section class="page-banner">
        <h1>Contact Us</h1>
        <p>We would love to hear from you!</p>
    </section>

    <section class="contact-content">
        <div class="contact-info">
            <h2>Get In Touch</h2>
            <p>
                Have questions or need assistance?
                Send us a message and we will be happy to help.
            </p>

            <p><strong>Email:</strong> muteebabaloch08@gmail.com</p>
            <p><strong>Website:</strong> Maptitude</p>
        </div>

        <form id="contactForm">
            <label for="name">Your Name</label>
            <input type="text" id="name" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" required>

            <label for="message">Your Message</label>
            <textarea id="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Maptitude. All Rights Reserved.</p>
    </footer>

    <script src="maptitude.js"></script>
</body>
</html>
